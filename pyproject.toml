[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qatnet-quasar"
version = "0.1.0"
description = "Reproducible quantum-classical intrusion detection and simulated SDN prevention research prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.10,<2",
  "joblib>=1.3,<2",
  "torch>=2.2,<3",
  "pytorch-tabnet>=4.1,<5",
  "pennylane>=0.40,<1",
  "qiskit>=1.2,<3",
  "qiskit-aer>=0.15,<1",
  "matplotlib>=3.8,<4",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
